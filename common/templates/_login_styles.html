{# Gemeinsame Styles fuer den Anmeldescreen aller vier Apps.
   Brand-Look: cremes Papier, weisse Karte, Terracotta-CTA, Salbei-Akzente.
   Wird VOR dem </head> in jedem login.html eingebunden. #}
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%; overflow: auto;
  font-family: 'Nunito', 'Segoe UI', Arial, sans-serif;
  background: #f0eee9;          /* --brand-body-bg */
  color: #141414;                /* --brand-ink */
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

/* Zarte Cream-Wellen im Hintergrund (zwei Radialverlaeufe). */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(circle at 18% 22%,  rgba(217,220,201,0.55) 0%, transparent 42%),
    radial-gradient(circle at 82% 78%,  rgba(182,92,58,0.10)  0%, transparent 38%);
}

.login-wrap {
  position: relative; z-index: 1;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  min-height: 100%; gap: 32px; padding: 32px 24px;
}

/* ── Brand-Lockup oben ───────────────────────────────────── */
.login-brand {
  display: flex; flex-direction: column; align-items: center;
  gap: 6px;
  text-align: center;
}
.login-brand .login-brand-app {
  font-family: 'Nunito', sans-serif;
  font-size: 11px; font-weight: 800;
  letter-spacing: 0.22em; text-transform: uppercase;
  color: #b65c3a;                /* --brand-terracotta */
  margin-top: 2px;
}
/* Die Aufbau-Animation des Logos liefert common/brand/dorfkern-logo.js. */

/* ── Karte ───────────────────────────────────────────────── */
.login-card {
  background: #ffffff;
  border: 1px solid rgba(20,20,20,0.06);
  border-radius: 18px;
  padding: 32px;
  width: min(440px, 100%);
  box-shadow:
    0 12px 32px rgba(20, 20, 20, 0.10),
    0 2px 6px   rgba(20, 20, 20, 0.05);
}
.login-card h2 {
  font-family: 'Fraunces', Georgia, serif;
  font-size: 22px; font-weight: 500;
  color: #1a4010;                /* --gruen-dunkel */
  margin-bottom: 20px; text-align: center;
}

/* ── Tabs (Karte / Passwort) ─────────────────────────────── */
.login-tabs {
  display: flex; gap: 0; margin-bottom: 24px;
  border-radius: 10px; overflow: hidden;
  border: 2px solid #b65c3a;
}
.login-tab {
  flex: 1; padding: 14px 8px; border: none;
  font-family: 'Nunito', sans-serif; font-size: 16px; font-weight: 700;
  cursor: pointer; transition: background 0.15s, color 0.15s;
  background: #ffffff; color: #b65c3a;
}
.login-tab.active { background: #b65c3a; color: #faf7f0; }
.login-tab:not(.active):hover { background: #f4dccf; }

.login-mode { display: none; }
.login-mode.active { display: block; }

/* ── Formular ────────────────────────────────────────────── */
.form-group { margin-bottom: 18px; }
.form-group label {
  display: block; margin-bottom: 6px;
  color: #6a6a64; font-size: 12px;
  font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
}
.form-control {
  width: 100%; padding: 14px 16px;
  background: #faf7f0;
  border: 1px solid rgba(20,20,20,0.10);
  border-radius: 10px;
  color: #141414; font-size: 16px;
  font-family: 'Nunito', sans-serif;
}
.form-control:focus {
  outline: none;
  border-color: #b65c3a;
  box-shadow: 0 0 0 3px #f4dccf;
}

.btn-login {
  width: 100%; padding: 16px;
  background: #b65c3a; border: none; border-radius: 10px;
  color: #faf7f0; font-size: 16px; font-weight: 700;
  font-family: 'Nunito', sans-serif;
  cursor: pointer; margin-top: 6px;
  transition: background 0.12s, transform 0.06s;
}
.btn-login:hover  { background: #8a3f25; }
.btn-login:active { opacity: 0.9; transform: scale(0.99); }

.alert-error {
  background: #f6d8ce;
  border: 1px solid #b83030;
  color: #6a1810;
  padding: 12px 16px; border-radius: 8px;
  margin-bottom: 18px; font-size: 14px; text-align: center; font-weight: 700;
}

/* ── Karten-Scan-Bereich ─────────────────────────────────── */
.scan-area {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 32px 16px; gap: 16px;
  border: 3px dashed #b8c0a6;
  border-radius: 14px;
  background: #f7f6ee;
  min-height: 180px;
  cursor: pointer; transition: border-color 0.2s, background 0.2s;
}
.scan-area.focus {
  border-color: #b65c3a;
  background: #fbf0e8;
}
.scan-icon { font-size: 48px; line-height: 1; }
.scan-hint { font-size: 18px; color: #1a4010; font-weight: 600; text-align: center; }
.scan-hint-sub { font-size: 13px; color: #6a6a64; font-weight: 400; }
#scan-input { position: absolute; left: -9999px; opacity: 0; width: 1px; height: 1px; }

/* ── Touch-Tastatur ──────────────────────────────────────── */
.touch-kb { margin-top: 18px; }
.touch-kb .kb-row {
  display: flex; justify-content: center; gap: 4px; margin-bottom: 4px;
}
.touch-kb .kb-key {
  min-width: 34px; height: 44px; border: none; border-radius: 8px;
  background: #f2ede3; color: #141414;
  font-size: 18px; font-weight: 700;
  font-family: 'Nunito', sans-serif; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.1s, color 0.1s;
  -webkit-tap-highlight-color: transparent;
}
.touch-kb .kb-key:active { background: #d9dcc9; }
.touch-kb .kb-key.kb-wide  { min-width: 52px; font-size: 15px; }
.touch-kb .kb-key.kb-space { flex: 1; max-width: 180px; }
.touch-kb .kb-key.kb-enter {
  min-width: 72px; background: #b65c3a; color: #faf7f0; font-size: 14px;
}
.touch-kb .kb-key.kb-enter:active { background: #8a3f25; }
.touch-kb .kb-key.kb-shift.active { background: #1a4010; color: #faf7f0; }
</style>
