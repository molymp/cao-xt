{# Theme-Switcher (Admin-only) – speichert die Wahl zentral in
   DORFKERN_KONFIG ('ui.theme') via POST /api/system/theme.
   Andere Apps lesen den Wert beim naechsten Page-Render.
#}
<style>
  .theme-switcher {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 6px 4px 8px;
    border: 1px solid var(--border);
    background: var(--bg-hell);
    color: var(--text-mitte);
    border-radius: var(--radius-klein, 4px);
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
  }
  .theme-switcher:hover { color: var(--text-hell); }
  .theme-switcher select {
    background: transparent;
    color: inherit;
    border: none;
    font: inherit;
    cursor: pointer;
    outline: none;
    padding: 2px 4px;
  }
  .theme-switcher select option { color: #000; }
  .theme-switcher.busy { opacity: 0.5; pointer-events: none; }
</style>
<label class="theme-switcher" title="Farbschema fuer alle Dorfkern-Apps">
  <span aria-hidden="true">🎨</span>
  <select id="dorfkern-theme-select" aria-label="Theme">
    <option value="dorfkern-light">Hell</option>
    <option value="dorfkern-dark">Dunkel</option>
    <option value="dorfkern-gruen">Grün</option>
  </select>
</label>
<script>
(function() {
  var sel = document.getElementById('dorfkern-theme-select');
  if (!sel) return;
  // Aktuelles Theme (vom Server gerendert) als Auswahl setzen
  var curr = document.documentElement.getAttribute('data-theme')
             || 'dorfkern-light';
  sel.value = curr;

  sel.addEventListener('change', async function() {
    var v = sel.value;
    var label = sel.parentElement;
    label.classList.add('busy');
    try {
      var r = await fetch('/api/system/theme', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({theme: v}),
      }).then(r => r.json());
      if (r.ok) {
        // Sofortiger visueller Wechsel – andere Apps sehen das neue
        // Theme beim naechsten Page-Render (common.konfig-Cache 60s).
        document.documentElement.setAttribute('data-theme', v);
      } else {
        alert('Theme speichern fehlgeschlagen: ' + (r.msg || '?'));
        sel.value = curr;
      }
    } catch (e) {
      alert('Theme speichern fehlgeschlagen: ' + e);
      sel.value = curr;
    }
    label.classList.remove('busy');
  });
})();
</script>
